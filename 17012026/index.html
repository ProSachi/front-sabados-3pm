<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: black;
            overflow: hidden;
            position: relative;
        }

        /* Fondo dinámico para el body */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            animation: backgroundChangeBody 20s infinite;
            filter: brightness(0.4);
            z-index: -1;
        }

        @keyframes backgroundChangeBody {
            0% {
                background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1920');
            }

            33% {
                background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1920');
            }

            66% {
                background-image: url('https://images.unsplash.com/photo-1485827404703-89b55fcc595e?q=80&w=1920');
            }

            100% {
                background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1920');
            }
        }

        .form-container {
            position: relative;
            background-color: rgba(10, 10, 20, 0.7);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.3);
            width: 350px;
            color: white;
            border: 2px solid #00ffff;
            overflow: hidden;
            backdrop-filter: blur(15px);
            transition: transform 0.3s;
        }

        .form-container:hover {
            transform: scale(1.02);
        }

        /* Efecto de lava futurista incrementado */
        .form-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #00ffff, #008888, #14141e, #00ffff, #008888);
            background-size: 300% 300%;
            opacity: 0.6;
            z-index: -1;
            animation: lavaEffect 5s ease infinite;
            filter: blur(10px);
        }

        @keyframes lavaEffect {
            0% {
                background-position: 0% 50%;
                transform: scale(1);
            }

            50% {
                background-position: 100% 50%;
                transform: scale(1.15);
            }

            100% {
                background-position: 0% 50%;
                transform: scale(1);
            }
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #a0ffff;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            box-shadow: 0 0 10px #00ffff;
            background: rgba(0, 0, 0, 0.7);
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s;
        }

        button:hover {
            background-color: #00ffff;
            color: black;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2 id="titulo">Registro</h2>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name" id="label">Nombre:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button id="submit">Registrarse</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>

</html>
