<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Pokémon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-indigo-900 mb-2">Buscador de Pokémon</h1>
      <p class="text-gray-600">Busca cualquier Pokémon por nombre o número</p>
    </header>

    <div class="max-w-2xl mx-auto">
      <!-- Search Form -->
      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <div class="flex gap-2">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Ejemplo: pikachu, 25, ditto..." 
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <button 
            id="searchBtn" 
            class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition-colors font-semibold"
          >
            Buscar
          </button>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading" class="hidden text-center py-8">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
        <p class="text-gray-600 mt-4">Cargando...</p>
      </div>

      <!-- Error Message -->
      <div id="error" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
        <p class="text-red-800 font-semibold">Error:</p>
        <p id="errorMessage" class="text-red-600"></p>
      </div>

      <!-- Pokemon Card -->
      <div id="pokemonCard" class="hidden bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 p-6 text-white text-center">
          <img id="pokemonImage" src="/placeholder.svg" alt="" class="w-48 h-48 mx-auto mb-4 drop-shadow-xl" />
          <h2 id="pokemonName" class="text-3xl font-bold capitalize mb-2"> </h2>
          <p id="pokemonId" class="text-lg opacity-90"> </p>
        </div>

        <div class="p-6">
          <!-- Types -->
          <div class="mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">Tipos</h3>
            <div id="pokemonTypes" class="flex gap-2"></div>
          </div>

          <!-- Stats -->
          <div>
            <h3 class="text-lg font-semibold text-gray-800 mb-3">Estadísticas</h3>
            <div id="pokemonStats" class="space-y-2"></div>
          </div>

          <!-- Abilities -->
          <div class="mt-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">Habilidades</h3>
            <div id="pokemonAbilities" class="flex flex-wrap gap-2"></div>
          </div>

          <!-- Physical Info -->
          <div class="mt-6 grid grid-cols-2 gap-4">
            <div class="bg-gray-50 rounded-lg p-4 text-center">
              <p class="text-gray-600 text-sm mb-1">Altura</p>
              <p id="pokemonHeight" class="text-2xl font-bold text-indigo-600"></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-4 text-center">
              <p class="text-gray-600 text-sm mb-1">Peso</p>
              <p id="pokemonWeight" class="text-2xl font-bold text-indigo-600"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script type="module" src="script.js"></script>
</body>
</html>
